name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Check and Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install uv and just
        run: |
          pip install uv
          cargo install just

      - name: Install dependencies
        run: |
          pnpm install
          uv pip install -r services/core/pyproject.toml

      - name: Run checks
        run: just check

      - name: Verify Contracts
        run: |
          just gen
          git diff --exit-code packages/contracts
