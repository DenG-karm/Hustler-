[mypy]
files = services/core/hustler, services/core/tests, tests
namespace_packages = True
explicit_package_bases = True
mypy_path = .
strict = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True

# S0-1b: yeni kodda `Any` yasak. Aşağıdaki modül listesi (toplam 39 ihlal) eski borçtur;
# kapsam dışına YENİ modül eklenmez. Her satır S0-2'de kapanır.
[mypy-services.core.hustler.*]
disallow_any_explicit = True

