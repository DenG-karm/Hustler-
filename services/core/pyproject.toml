[project]
name = "core"
version = "0.1.0"
description = "Hustler FastAPI Sidecar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "colorama>=0.4.6",
    "tenacity>=9.2.1",
    "aiofiles>=25.1.0",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
